# Gera o APK de debug do jogo (HTML/Capacitor) e, se for uma tag v*, publica numa Release. Nome e pacote saem do <title> do index.html.
# Mesma estrutura do workflow do Godot (versoes novas das acoes, limite de tempo,
# versao numerada por execucao, APK publicado em Release). Como o projeto e um
# index.html (nao tem project.godot), a compilacao usa Capacitor em vez do Godot.
name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Versao
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="teste.$GITHUB_RUN_NUMBER"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo ">>> Versao: $VERSION (codigo $((100000 + GITHUB_RUN_NUMBER)))"

      - name: 1 - Descompactar o projeto (acha o ZIP certo sozinho)
        run: |
          ls -la
          mkdir -p proj_unzipped
          PROJ=""
          for Z in *.zip; do
            [ -f "$Z" ] || continue
            echo "--- Verificando o ZIP: $Z"
            LIST=$(unzip -l "$Z" 2>/dev/null || true)
            echo "$LIST" | sed -n '1,25p'
            case "$LIST" in
              *index.html*)
                D="proj_unzipped/${Z%.zip}"
                mkdir -p "$D"
                unzip -q "$Z" -d "$D"
                IFILE=$(find "$D" -name index.html | sed -n '1p')
                if [ -n "$IFILE" ]; then
                  PROJ=$(dirname "$IFILE")
                  echo ">>> ENCONTRADO o jogo no ZIP: $Z"
                  break
                fi
                ;;
              *)
                echo "--- $Z NAO tem index.html, ignorando"
                ;;
            esac
          done
          if [ -z "$PROJ" ]; then
            echo "--- Nenhum ZIP serviu. Procurando arquivos soltos no repositorio..."
            IFILE=$(find . -path ./proj_unzipped -prune -o -path ./node_modules -prune -o -path ./android -prune -o -name index.html -print | sed -n '1p')
            if [ -n "$IFILE" ]; then
              PROJ=$(dirname "$IFILE")
              echo ">>> ENCONTRADO projeto solto em: $PROJ"
            fi
          fi
          if [ -z "$PROJ" ]; then
            echo "ERRO: nao achei index.html em nenhum ZIP nem solto no repositorio."
            echo "Envie o RAPSTAR-AFTER-HOURS-PROTOTIPO.zip (ou o index.html) para a pagina principal do repositorio."
            exit 1
          fi
          echo ">>> Projeto em: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          ls -la "$PROJ"

      - name: 2 - Criar o projeto Capacitor (nome e pacote vem do index.html)
        run: |
          NAME=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$PROJ/index.html" | sed -n '1p')
          [ -n "$NAME" ] || NAME="Game"
          SLUG=$(printf '%s' "$NAME" | tr -cd 'A-Za-z0-9')
          [ -n "$SLUG" ] || SLUG="Game"
          case "$SLUG" in [0-9]*) SLUG="G$SLUG" ;; esac
          PKG="com.$(printf '%s' "$SLUG" | tr 'A-Z' 'a-z').game"
          echo "GAME_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo ">>> Nome: $NAME | arquivo: $SLUG | pacote: $PKG"

          mkdir -p www
          cp -r "$PROJ"/. www/
          rm -f www/LEIA-ME.txt
          test -f www/index.html || { echo "ERRO: www/index.html nao foi criado"; exit 1; }

          cat > package.json <<'JSON'
          {
            "name": "rapstar-after-hours",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.1",
              "@capacitor/android": "^6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.1"
            }
          }
          JSON

          printf '%s\n' \
            '{' \
            "  \"appId\": \"$PKG\"," \
            "  \"appName\": \"$NAME\"," \
            '  "webDir": "www"' \
            '}' \
            > capacitor.config.json
          echo ">>> capacitor.config.json criado:"
          cat capacitor.config.json

      - name: 3 - Android SDK
        run: |
          echo ">>> ANDROID_HOME=$ANDROID_HOME"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          echo ">>> sdkmanager: $SDKM"
          echo ">>> Ja instalado antes:"
          ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" || true
          yes | "$SDKM" --licenses > /dev/null || true
          for P in "platform-tools" "build-tools;34.0.0" "platforms;android-34"; do
            echo ">>> Instalando $P"
            "$SDKM" --install "$P" || echo "AVISO: nao instalou $P (continuando)"
          done
          echo ">>> Instalado agora:"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" || true

      - name: 4 - Instalar Capacitor e criar o projeto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
          ls -la android

      - name: 4b - Versao do app no build.gradle
        run: |
          G=android/app/build.gradle
          sed -i "s|versionCode [0-9]*|versionCode $VERSION_CODE|; s|versionName \"[^\"]*\"|versionName \"$VERSION\"|" "$G"
          echo ">>> Versao aplicada no build.gradle:"
          grep -n -E "versionCode|versionName|applicationId" "$G"

      - name: 5 - Verificar arquivos do jogo (nao bloqueia o APK)
        continue-on-error: true
        run: |
          ls -l android/app/src/main/assets/public/
          test -s android/app/src/main/assets/public/index.html

      - name: 6 - Compilar APK (mostra o erro se falhar)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../export.log || true
          cd ..
          BUILT="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$BUILT" ]; then
            echo ""
            echo "=================== FALHOU: O APK NAO FOI CRIADO ==================="
            echo "--- Linhas de erro do Gradle ---"
            grep -n -i -E "error|invalid|missing|not found|failed|cannot" export.log | head -n 40 || true
            echo "--- Ultimas 40 linhas do Gradle ---"
            tail -n 40 export.log
            echo "--- build-tools e platforms instalados ---"
            ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" || true
            FIRST=$(grep -i -m1 -E "error" export.log | tr -d '\r' | cut -c1-250 || true)
            echo "::error title=Gradle nao criou o APK::$FIRST"
            {
              echo "### FALHOU: o APK nao foi criado"
              echo ""
              echo "**Linhas de erro:**"
              echo '```'
              grep -n -i -E "error|invalid|missing|not found|failed|cannot" export.log | head -n 20 || true
              echo '```'
              echo "**Ultimas linhas:**"
              echo '```'
              tail -n 25 export.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp "$BUILT" "$GITHUB_WORKSPACE/out/game-debug.apk"
          echo ">>> APK CRIADO:"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Nomear o APK
        run: |
          mv "$GITHUB_WORKSPACE/out/game-debug.apk" "$GITHUB_WORKSPACE/out/$SLUG-$VERSION.apk"
          echo "APK_FILE=out/$SLUG-$VERSION.apk" >> "$GITHUB_ENV"
          ls -l out
          sha256sum "out/$SLUG-$VERSION.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.SLUG }}-${{ env.VERSION }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publicar na Release (so quando for uma tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_FILE" \
            --title "$GAME_NAME $GITHUB_REF_NAME" \
            --notes "APK de DEBUG para teste pessoal. Para instalar, permita instalar apps de fontes desconhecidas."

      - name: Guardar o log do Gradle (sempre, mesmo se falhar)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-build-log
          path: export.log
          if-no-files-found: ignore
