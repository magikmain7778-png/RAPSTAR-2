name: Build RAPSTAR APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verificar e preparar o protótipo
        shell: bash
        run: |
          set -e
          if [ ! -f index.html ]; then
            echo "::error::index.html não encontrado na raiz do repositório."
            exit 1
          fi

          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'JSON'
          {
            "name": "rapstar-after-hours",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.1",
              "@capacitor/android": "^6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.1"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.afterhours.rapstar",
            "appName": "RAPSTAR After Hours",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::O APK não foi gerado."
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/RAPSTAR-AFTER-HOURS-debug.apk
          sha256sum out/RAPSTAR-AFTER-HOURS-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RAPSTAR-AFTER-HOURS-APK
          path: out/RAPSTAR-AFTER-HOURS-debug.apk
          if-no-files-found: error
          retention-days: 14
          
