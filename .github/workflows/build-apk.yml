
name: Build RAPSTAR APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto Android
        shell: bash
        run: |
          test -f index.html || { echo 'ERRO: index.html nao encontrado na raiz'; exit 1; }
          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'JSON'
          {
            "name": "rapstar-after-hours",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.1",
              "@capacitor/android": "^6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.1"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.afterhours.rapstar",
            "appName": "RAPSTAR After Hours",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RAPSTAR-AFTER-HOURS-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
